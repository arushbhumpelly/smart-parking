<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login – Smart Parking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: #1e293b;
            padding: 2rem;
            border-radius: 8px;
            width: 320px;
        }
        h1 {
            font-size: 1.4rem;
            margin-top: 0;
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 0.25rem;
            font-size: 0.9rem;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border-radius: 4px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.6rem;
            border: none;
            border-radius: 4px;
            background: #3b82f6;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .error {
            color: #f87171;
            margin-bottom: 0.75rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Admin Login</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              {% if category == "error" %}
                <div class="error">{{ message }}</div>
              {% endif %}
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="post">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
